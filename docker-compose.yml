services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: permission_ledger
      POSTGRES_USER: permission_ledger
      POSTGRES_PASSWORD: permission_ledger
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U permission_ledger -d permission_ledger"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://permission_ledger:permission_ledger@postgres:5432/permission_ledger
      BACKEND_BIND_ADDR: 0.0.0.0:3000
      WEB_ORIGIN: http://localhost:5173
      COOKIE_SECURE: "false"
      RUST_LOG: permission_ledger_backend=info,tower_http=info
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile.dev
    environment:
      # Same-origin in development too: the Vite dev server proxies /api.
      API_PROXY_TARGET: http://backend:3000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./web/src:/app/src

  extension-build:
    build:
      context: .
      dockerfile: extension/Dockerfile
    profiles: ["tools"]
    volumes:
      - ./extension/dist:/app/dist

volumes:
  postgres_data:
